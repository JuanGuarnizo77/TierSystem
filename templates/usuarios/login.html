<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TierSystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2E7D32', secondary: '#4CAF50', dark: '#1B5E20', accent: '#FBC02D', light: '#E8F5E9' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute -top-20 -left-20 w-72 h-72 bg-primary rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
    <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-accent rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 2s;"></div>

    <!-- Botón Regresar -->
    <a href="{% url 'home' %}" class="absolute top-6 left-6 w-12 h-12 bg-white rounded-full shadow-md flex items-center justify-center text-gray-600 hover:text-primary hover:shadow-lg transition-all transform hover:-translate-y-1 z-50">
        <i class="fa-solid fa-arrow-left text-xl"></i>
    </a>

    <!-- Card Contenedor -->
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden relative z-10 border border-gray-100">
        
        <div class="p-8 sm:p-12">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-light rounded-full mb-4">
                    <i class="fa-solid fa-leaf text-3xl text-primary"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900">Bienvenido de nuevo</h2>
                <p class="text-gray-500 mt-2">Ingresa tus datos para acceder a tu panel.</p>
            </div>

            {% if form.errors %}
                <div class="bg-red-50 text-red-600 p-4 rounded-lg mb-6 text-sm border border-red-200">
                    <i class="fa-solid fa-circle-exclamation mr-2"></i> Credenciales incorrectas. Por favor, intenta de nuevo.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" class="space-y-6">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-user text-gray-400"></i>
                        </div>
                        <input type="text" name="username" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Tu nombre de usuario" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" name="password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-700">Recordarme</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-primary hover:text-dark">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary hover:bg-dark text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    Iniciar Sesión <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-600">
                ¿No tienes una cuenta?
                <a href="{% url 'registro' %}" class="font-bold text-primary hover:text-dark transition-colors">Regístrate aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
