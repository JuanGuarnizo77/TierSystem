{% load static %}
<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Restablecida - TierSystem</title>
    <script src="/static/js/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0a4d3c',
                        secondary: '#0d624d',
                        accent: '#10b981',
                        dark: '#0f172a',
                        light: '#f4fbf7',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="mesh-bg text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="bento-card w-full max-w-md overflow-hidden relative z-10 border border-gray-100 p-6 sm:p-8 text-center">
        
        <div class="w-20 h-20 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm border border-green-200">
            <i class="fa-solid fa-circle-check text-4xl"></i>
        </div>
        
        <div class="flex items-center justify-center gap-2 mb-2">
            <i class="fa-solid fa-leaf text-primary text-lg"></i>
            <h1 class="text-2xl font-bold font-heading text-gray-900 tracking-tight">Tier<span class="text-primary">System</span></h1>
        </div>
        
        <h2 class="text-2xl font-bold font-heading text-gray-900 mt-2">¡Contraseña Restablecida!</h2>
        
        <p class="text-xs text-gray-600 mt-3 leading-relaxed">
            Tu contraseña ha sido actualizada exitosamente. Ya puedes iniciar sesión con tus nuevas credenciales y acceder a la plataforma.
        </p>

        <div class="mt-8">
            <a href="{% url 'login' %}" class="w-full bg-primary hover:bg-secondary text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 text-sm">
                <span>Iniciar Sesión Ahora</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
        </div>
    </div>

</body>
</html>
